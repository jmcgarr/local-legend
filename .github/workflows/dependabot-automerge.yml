name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only Dependabot's own PRs in this repo — never forks or other authors.
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'jmcgarr/local-legend'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2

      # Major version bumps are left for human review; everything else is
      # approved and set to auto-merge once required status checks pass.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review "$PR_URL" --approve
          gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
