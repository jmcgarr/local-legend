name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: local-legends-linux-x86_64.tar.gz
          - os: macos-latest
            asset: local-legends-macos-arm64.tar.gz
          - os: windows-latest
            asset: local-legends-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: pytest -q

      # --onedir, not --onefile: a single-file build re-extracts the whole
      # bundle on EVERY launch (~6s startup); the folder bundle starts in
      # ~0.2s after the OS scans it once.
      - name: Build binary
        run: >
          pyinstaller --onedir --name local-legends
          --collect-submodules keyring.backends
          local_legends.py

      - name: Smoke-test and package
        shell: bash
        run: |
          cd dist
          ./local-legends/local-legends --help
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.asset }}" local-legends
          else
            tar -czf "${{ matrix.asset }}" local-legends
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
