name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: local-legends-linux-x86_64
          - os: macos-latest
            asset: local-legends-macos-arm64
          - os: windows-latest
            asset: local-legends-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: pytest -q

      - name: Build binary
        run: >
          pyinstaller --onefile --name local-legends
          --collect-submodules keyring.backends
          local_legends.py

      - name: Rename and smoke-test binary
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv local-legends.exe "${{ matrix.asset }}"
          else
            mv local-legends "${{ matrix.asset }}"
          fi
          ./"${{ matrix.asset }}" --help

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
